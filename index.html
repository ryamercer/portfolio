<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Mercer — Audio Technician</title>
<meta name="description" content="Ryan Mercer, live audio and broadcast technician.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161B;
    --surface:#1C1F26;
    --surface-hi:#22262F;
    --text:#EDEBE6;
    --text-dim:#8B8D93;
    --line:#2A2D35;
    --accent:#E8A33D;
    --accent-dim:#8A6326;
  }

  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px; /* clears the fixed player */
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  h1{ font-family:'Space Grotesk', sans-serif; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------------- header ---------------- */
  header.masthead{
    padding:clamp(32px,7vw,72px) clamp(20px,6vw,64px) clamp(24px,4vw,40px);
    border-bottom:1px solid var(--line);
  }
  header.masthead h1{
    font-size:clamp(30px,4.5vw,52px);
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header.masthead .role{
    color:var(--accent);
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin:0 0 18px;
  }
  header.masthead .contact{
    display:flex;
    flex-wrap:wrap;
    gap:4px 14px;
    color:var(--text-dim);
    font-size:13.5px;
  }
  header.masthead .contact a{
    color:var(--text-dim);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    transition:color .15s, border-color .15s;
  }
  header.masthead .contact a:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---------------- track grid ---------------- */
  main{ padding:clamp(24px,5vw,40px) clamp(20px,6vw,64px) 0; max-width:1400px; }

  .list-head{
    margin:0 0 18px;
    color:var(--text-dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:14px;
  }

  .card{
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--surface);
    overflow:hidden;
    transition:border-color .15s;
  }
  .card:hover{ border-color:var(--accent-dim); }
  .card.playing{ border-color:var(--accent); }

  .thumb-wrap{
    position:relative;
    aspect-ratio:16/9;
    background:#0B0C0F;
    overflow:hidden;
  }
  .thumb-wrap img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:saturate(0.55) brightness(0.5);
  }
  .thumb-fallback{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px),
      var(--surface-hi);
  }
  .thumb-fallback svg{ width:24px; height:24px; opacity:0.3; }

  .thumb-state{
    position:absolute; top:8px; left:8px;
    width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .bars{ display:flex; align-items:flex-end; gap:2px; height:13px; }
  .bars span{
    width:2.5px; background:var(--accent); display:block;
    animation:bounce 0.9s ease-in-out infinite;
  }
  .bars span:nth-child(1){ height:40%; animation-delay:0s; }
  .bars span:nth-child(2){ height:100%; animation-delay:.15s; }
  .bars span:nth-child(3){ height:65%; animation-delay:.3s; }
  @keyframes bounce{ 0%,100%{ transform:scaleY(0.4); } 50%{ transform:scaleY(1); } }

  .card .meta{ padding:10px 12px 4px; }
  .card .title{ font-weight:600; font-size:13.5px; color:var(--text); }
  .card .sub{ font-size:11px; color:var(--text-dim); margin-top:3px; }

  .card-actions{
    display:flex;
    gap:8px;
    padding:10px 12px 12px;
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    flex:1;
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    font-family:inherit;
    font-size:11.5px;
    padding:8px 10px;
    border-radius:4px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn svg{ width:11px; height:11px; flex:none; }
  .btn:hover{ color:var(--text); border-color:var(--text-dim); }

  .btn-play{ color:var(--accent); border-color:var(--accent-dim); }
  .btn-play:hover{ border-color:var(--accent); }
  .card.playing .btn-play{ background:rgba(232,163,61,0.1); }

  .btn-watch:hover{ color:var(--accent); border-color:var(--accent-dim); }

  .no-video{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--text-dim); opacity:0.55;
    border:1px dashed var(--line);
    border-radius:4px;
    padding:8px 10px;
  }

  @media (max-width:480px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
    .card .title{ font-size:12.5px; }
    .btn{ font-size:10.5px; padding:7px 6px; }
    .btn .btn-label{ display:none; }
  }

  /* ---------------- video lightbox ---------------- */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(8,9,11,0.9);
    display:none;
    align-items:center;
    justify-content:center;
    padding:clamp(16px,5vw,60px);
    z-index:200;
  }
  .lightbox.open{ display:flex; }
  .lightbox-box{
    position:relative;
    width:100%;
    max-width:860px;
    aspect-ratio:16/9;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .lightbox-box iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .lightbox-close{
    position:absolute; top:10px; right:10px;
    z-index:5;
    background:rgba(11,12,15,0.85);
    border:1px solid var(--line);
    color:var(--text);
    width:34px; height:34px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .lightbox-close:hover{ color:var(--accent); border-color:var(--accent); background:rgba(11,12,15,0.95); }
  .lightbox-close svg{ width:16px; height:16px; }
  .lightbox-hint{
    position:absolute; top:16px; left:16px;
    z-index:5;
    color:var(--text-dim);
    font-size:11px;
    background:rgba(11,12,15,0.7);
    padding:5px 9px;
    border-radius:4px;
    pointer-events:none;
  }

  /* ---------------- sticky playhead footer ---------------- */
  .player{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:12px clamp(16px,4vw,40px);
    display:flex;
    align-items:center;
    gap:16px;
    z-index:50;
  }

  .player .playpause{
    flex:none;
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--accent-dim);
    background:var(--bg);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .player .playpause:hover{ border-color:var(--accent); }
  .player .playpause svg{ width:14px; height:14px; }

  .player .now{
    flex:none;
    min-width:0;
    max-width:220px;
    display:none;
  }
  .player .now .now-title{ font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player .now .now-sub{ font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .player .scrub{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .player .time{ color:var(--text-dim); font-size:11.5px; flex:none; width:36px; }
  .player .time.dur{ text-align:right; }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:3px;
    background:var(--line);
    border-radius:2px;
    outline:none;
    min-width:0;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px; height:11px; border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    margin-top:-4px;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; border:none; background:var(--accent); cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:3px; border-radius:2px; }

  .player .empty-msg{ color:var(--text-dim); font-size:12.5px; }

  @media (max-width:640px){
    .player .now{ display:none !important; }
  }

  footer.credit{
    padding:28px clamp(20px,6vw,64px) 8px;
    color:var(--text-dim);
    font-size:11.5px;
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>Ryan Mercer</h1>
  <p class="role">Audio Technician</p>
  <p class="contact">
    <a href="mailto:rmercer105@gmail.com">rmercer105@gmail.com</a>
    <span>·</span>
    <a href="tel:6123004465">612-300-4465</a>
    <span>·</span>
    <span>Madison, WI</span>
  </p>
</header>

<main>
  <div class="list-head">FOH Recordings</div>
  <div class="grid" id="grid"></div>
</main>

<footer class="credit">© 2026 Ryan Mercer</footer>

<div class="player">
  <button class="playpause" id="playPause" aria-label="Play" disabled>
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="now" id="nowPlaying">
    <div class="now-title" id="nowTitle">—</div>
    <div class="now-sub" id="nowSub"></div>
  </div>
  <div class="scrub">
    <span class="time" id="curTime">0:00</span>
    <input type="range" id="seek" value="0" min="0" max="100" step="0.1" disabled>
    <span class="time dur" id="durTime">0:00</span>
  </div>
  <span class="empty-msg" id="emptyMsg">Select a track</span>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-box" id="lightboxBox">
    <span class="lightbox-hint">Esc or click outside to close</span>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ============================================================
   ADD A TRACK: append one object to this array. Nothing else
   in this file needs to change.

   title      : artist / act name, shown on the card
   date       : "YYYY-MM-DD" or any short label
   tags       : short genre/context string
   audioFile  : filename of the audio file, sitting in this
                same folder (upload it alongside index.html)
   youtubeId  : the ID from the YouTube URL, e.g. for
                https://youtu.be/feyz3PxqceQ the ID is
                "feyz3PxqceQ". Leave as "" if there's no video
                yet — the card shows "No video yet" instead.
============================================================ */
const TRACKS = [
  {
    title: "lightris & sero",
    date: "2026-06-03",
    tags: "Cloud Rap, Alt-Pop",
    audioFile: "2026-06-03 lightris & sero excerpt.wav",
    youtubeId: "feyz3PxqceQ"
  },
  {
    title: "Sapsucker",
    date: "2026-06-13",
    tags: "Indie Rock, Indie Pop",
    audioFile: "2026-06-13 Sapsucker excerpt.wav",
    youtubeId: "R3ewWeoLWHw"
  },
  {
    title: "Steeplechase",
    date: "2026-06-26",
    tags: "Singer-Songwriter, Indie Pop",
    audioFile: "2026-06-26 Steeplechase excerpt.wav",
    youtubeId: "dcFNNLd9dW8"
  },
  {
    title: "diog3n3s",
    date: "2026-08-07",
    tags: "Singer-Songwriter, Indie Folk",
    audiofile: "2026-08-07 diog3n3s excerpt.wav",
    youtubeId: "UYB5IYjAgcY"
  }
];

const gridEl = document.getElementById('grid');
const audio = document.getElementById('audio');
const playPauseBtn = document.getElementById('playPause');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const seek = document.getElementById('seek');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const nowPlayingEl = document.getElementById('nowPlaying');
const nowTitleEl = document.getElementById('nowTitle');
const nowSubEl = document.getElementById('nowSub');
const emptyMsg = document.getElementById('emptyMsg');
const lightbox = document.getElementById('lightbox');
const lightboxBox = document.getElementById('lightboxBox');
const lightboxClose = document.getElementById('lightboxClose');

let currentIndex = -1;
let cardEls = [];
let playBtnEls = [];

function fmt(t){
  if(!isFinite(t)) return "0:00";
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

const PLAY_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const WATCH_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>`;
const NOTE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`;

TRACKS.forEach((t, i) => {
  const card = document.createElement('div');
  card.className = 'card';

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'thumb-wrap';
  thumbWrap.innerHTML = t.youtubeId
    ? `<img src="https://img.youtube.com/vi/${t.youtubeId}/mqdefault.jpg" alt="" loading="lazy">`
    : `<div class="thumb-fallback">${NOTE_SVG}</div>`;
  const stateEl = document.createElement('span');
  stateEl.className = 'thumb-state';
  thumbWrap.appendChild(stateEl);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `
    <div class="title">${t.title}</div>
    <div class="sub">${t.date} · ${t.tags}</div>
  `;

  const actions = document.createElement('div');
  actions.className = 'card-actions';

  const playBtn = document.createElement('button');
  playBtn.className = 'btn btn-play';
  playBtn.innerHTML = `${PLAY_SVG}<span class="btn-label">Play</span>`;
  playBtn.addEventListener('click', () => playTrack(i));
  actions.appendChild(playBtn);

  if(t.youtubeId){
    const watchBtn = document.createElement('button');
    watchBtn.className = 'btn btn-watch';
    watchBtn.innerHTML = `${WATCH_SVG}<span class="btn-label">Watch</span>`;
    watchBtn.addEventListener('click', () => openLightbox(t.youtubeId, t.title));
    actions.appendChild(watchBtn);
  } else {
    const noVid = document.createElement('span');
    noVid.className = 'no-video';
    noVid.textContent = 'No video yet';
    actions.appendChild(noVid);
  }

  card.appendChild(thumbWrap);
  card.appendChild(meta);
  card.appendChild(actions);
  gridEl.appendChild(card);

  cardEls.push(card);
  playBtnEls.push(playBtn);
});

function openLightbox(youtubeId, title){
  lightboxBox.querySelectorAll('iframe').forEach(f => f.remove());
  const iframe = document.createElement('iframe');
  iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
  iframe.title = title;
  iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
  iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
  iframe.setAttribute('allowfullscreen', '');
  iframe.frameBorder = '0';
  lightboxBox.insertBefore(iframe, lightboxBox.firstChild);
  lightbox.classList.add('open');
}

function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxBox.querySelectorAll('iframe').forEach(f => f.remove());
}

lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });

function renderStates(){
  cardEls.forEach((card, i) => {
    const stateEl = card.querySelector('.thumb-state');
    const playBtn = playBtnEls[i];
    const isCurrent = i === currentIndex;
    card.classList.toggle('playing', isCurrent);
    if(isCurrent && !audio.paused){
      stateEl.innerHTML = '<span class="bars"><span></span><span></span><span></span></span>';
      playBtn.innerHTML = `<span class="bars"><span></span><span></span><span></span></span><span class="btn-label">Pause</span>`;
    } else {
      stateEl.innerHTML = '';
      playBtn.innerHTML = `${PLAY_SVG}<span class="btn-label">Play</span>`;
    }
  });
}

function playTrack(i){
  if(currentIndex === i){
    if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
    return;
  }
  currentIndex = i;
  const t = TRACKS[i];
  audio.src = encodeURI(t.audioFile);
  audio.play().catch(()=>{});

  nowPlayingEl.style.display = 'block';
  nowTitleEl.textContent = t.title;
  nowSubEl.textContent = `${t.date} · ${t.tags}`;
  playPauseBtn.disabled = false;
  seek.disabled = false;
  emptyMsg.style.display = 'none';
  renderStates();
}

playPauseBtn.addEventListener('click', () => {
  if(currentIndex === -1) return;
  if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
});

audio.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = '';
  playPauseBtn.setAttribute('aria-label','Pause');
  renderStates();
});
audio.addEventListener('pause', () => {
  playIcon.style.display = '';
  pauseIcon.style.display = 'none';
  playPauseBtn.setAttribute('aria-label','Play');
  renderStates();
});
audio.addEventListener('ended', () => {
  if(currentIndex < TRACKS.length - 1){
    playTrack(currentIndex + 1);
  } else {
    renderStates();
  }
});

let draggingSeek = false;
seek.addEventListener('mousedown', () => { draggingSeek = true; });
seek.addEventListener('touchstart', () => { draggingSeek = true; }, {passive:true});

function commitSeek(){
  draggingSeek = false;
  if(isFinite(audio.duration)){
    audio.currentTime = (seek.value / 100) * audio.duration;
  }
}
seek.addEventListener('mouseup', commitSeek);
seek.addEventListener('touchend', commitSeek);

seek.addEventListener('input', () => {
  if(isFinite(audio.duration)){
    curTimeEl.textContent = fmt((seek.value/100) * audio.duration);
  }
});

audio.addEventListener('timeupdate', () => {
  if(!isFinite(audio.duration)) return;
  if(!draggingSeek){
    seek.value = (audio.currentTime / audio.duration) * 100;
  }
  curTimeEl.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(audio.duration);
});
</script>

</body>
</html>
