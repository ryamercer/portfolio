<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ryan Mercer — Audio Technician</title>
<meta name="description" content="Ryan Mercer, live audio and broadcast technician.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161B;
    --surface:#1C1F26;
    --surface-hi:#22262F;
    --text:#EDEBE6;
    --text-dim:#8B8D93;
    --line:#2A2D35;
    --accent:#E8A33D;
    --accent-dim:#8A6326;
  }

  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px; /* clears the fixed player */
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }

  h1{ font-family:'Space Grotesk', sans-serif; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------------- header ---------------- */
  header.masthead{
    padding:clamp(28px,6vw,56px) clamp(20px,6vw,64px) clamp(20px,4vw,32px);
    border-bottom:1px solid var(--line);
  }
  header.masthead h1{
    font-size:clamp(28px,4vw,44px);
    font-weight:700;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  header.masthead .role{
    color:var(--accent);
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    margin:0 0 14px;
  }
  header.masthead .contact{
    display:flex;
    flex-wrap:wrap;
    gap:4px 14px;
    color:var(--text-dim);
    font-size:13px;
  }
  header.masthead .contact a{
    color:var(--text-dim);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    transition:color .15s, border-color .15s;
  }
  header.masthead .contact a:hover{ color:var(--accent); border-color:var(--accent); }

  /* ---------------- layout ---------------- */
  main{
    padding:clamp(20px,4vw,32px) clamp(20px,6vw,64px) 0;
    max-width:1400px;
  }

  .layout{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:880px){
    .layout{ grid-template-columns:1fr; }
  }

  .list-head{
    margin:0 0 12px;
    color:var(--text-dim);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.1em;
  }

  /* ---------------- scrolling list ---------------- */
  .list-panel{
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--surface);
    max-height:min(560px, 70vh);
    overflow-y:auto;
  }
  @media (max-width:880px){
    .list-panel{ max-height:420px; }
  }

  .track-row{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:12px 14px;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    text-align:left;
    cursor:pointer;
  }
  .track-row:last-child{ border-bottom:none; }
  .track-row:hover{ background:var(--surface-hi); }
  .track-row.active{ background:rgba(232,163,61,0.08); }

  .track-num{
    font-family:'Space Grotesk', sans-serif;
    font-size:12px;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:3px;
    height:24px;
    width:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
  }
  .track-row.active .track-num{ color:var(--accent); border-color:var(--accent-dim); }

  .track-meta{ min-width:0; flex:1; }
  .track-title{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-sub{ font-size:11px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .track-state{ width:16px; height:16px; flex:none; display:flex; align-items:center; justify-content:center; }
  .bars{ display:flex; align-items:flex-end; gap:2px; height:12px; }
  .bars span{
    width:2.5px; background:var(--accent); display:block;
    animation:bounce 0.9s ease-in-out infinite;
  }
  .bars span:nth-child(1){ height:40%; animation-delay:0s; }
  .bars span:nth-child(2){ height:100%; animation-delay:.15s; }
  .bars span:nth-child(3){ height:65%; animation-delay:.3s; }
  @keyframes bounce{ 0%,100%{ transform:scaleY(0.4); } 50%{ transform:scaleY(1); } }

  /* ---------------- video panel ---------------- */
  .video-panel{
    position:sticky;
    top:20px;
  }
  .video-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#0B0C0F;
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .video-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-frame .placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:8px;
    color:var(--text-dim); font-size:12.5px; text-align:center; padding:20px;
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 10px),
      var(--surface);
  }
  .video-frame .placeholder svg{ width:26px; height:26px; opacity:0.3; }

  .video-caption{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
    font-size:12px;
    color:var(--text-dim);
  }
  .video-caption .vc-title{ color:var(--text); font-weight:600; font-size:13.5px; }

  @media (max-width:880px){
    .video-panel{ position:static; }
  }

  /* ---------------- sticky playhead footer ---------------- */
  .player{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:12px clamp(16px,4vw,40px);
    display:flex;
    align-items:center;
    gap:16px;
    z-index:50;
  }

  .player .playpause{
    flex:none;
    width:38px; height:38px;
    border-radius:50%;
    border:1px solid var(--accent-dim);
    background:var(--bg);
    color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .player .playpause:hover{ border-color:var(--accent); }
  .player .playpause svg{ width:14px; height:14px; }

  .player .now{
    flex:none;
    min-width:0;
    max-width:220px;
    display:none;
  }
  .player .now .now-title{ font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player .now .now-sub{ font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .player .scrub{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .player .time{ color:var(--text-dim); font-size:11.5px; flex:none; width:36px; }
  .player .time.dur{ text-align:right; }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    flex:1; height:3px;
    background:var(--line);
    border-radius:2px;
    outline:none;
    min-width:0;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px; height:11px; border-radius:50%;
    background:var(--accent);
    cursor:pointer;
    margin-top:-4px;
  }
  input[type="range"]::-moz-range-thumb{
    width:11px; height:11px; border-radius:50%; border:none; background:var(--accent); cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:3px; border-radius:2px; }

  .player .empty-msg{ color:var(--text-dim); font-size:12.5px; }

  @media (max-width:640px){
    .player .now{ display:none !important; }
  }

  footer.credit{
    padding:28px clamp(20px,6vw,64px) 8px;
    color:var(--text-dim);
    font-size:11.5px;
  }
</style>
</head>
<body>

<header class="masthead">
  <h1>Ryan Mercer</h1>
  <p class="role">Audio Technician</p>
  <p class="contact">
    <a href="mailto:rmercer105@gmail.com">rmercer105@gmail.com</a>
    <span>·</span>
    <a href="tel:6123004465">612-300-4465</a>
    <span>·</span>
    <span>Madison, WI</span>
  </p>
</header>

<main>
  <div class="list-head">FOH Recordings — click a track to play</div>
  <div class="layout">
    <div class="list-panel" id="listPanel"></div>

    <div class="video-panel">
      <div class="video-frame" id="videoFrame">
        <div class="placeholder" id="videoPlaceholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          Select a track to begin
        </div>
      </div>
      <div class="video-caption">
        <span class="vc-title" id="vcTitle"></span>
        <span id="vcNote"></span>
      </div>
    </div>
  </div>
</main>

<footer class="credit">© 2026 Ryan Mercer</footer>

<div class="player">
  <button class="playpause" id="playPause" aria-label="Play" disabled>
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="now" id="nowPlaying">
    <div class="now-title" id="nowTitle">—</div>
    <div class="now-sub" id="nowSub"></div>
  </div>
  <div class="scrub">
    <span class="time" id="curTime">0:00</span>
    <input type="range" id="seek" value="0" min="0" max="100" step="0.1" disabled>
    <span class="time dur" id="durTime">0:00</span>
  </div>
  <span class="empty-msg" id="emptyMsg">Select a track</span>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ============================================================
   ADD A TRACK: append one object to this array. Nothing else
   in this file needs to change.

   title      : artist / act name, shown in the list
   date       : "YYYY-MM-DD" or any short label
   tags       : short genre/context string
   audioFile  : filename of the audio file, sitting in this
                same folder (upload it alongside index.html).
                This is what actually plays through the bottom
                player. It always plays when you click the row.
   youtubeId  : the ID from the YouTube URL, e.g. for
                https://youtu.be/feyz3PxqceQ the ID is
                "feyz3PxqceQ". Leave as "" if there is no video
                yet. The video panel shows the video muted (the
                audio track is the sound source) if present, or
                a placeholder if not.
============================================================ */
const TRACKS = [
  {
    title: "lightris & sero",
    date: "2026-06-03",
    tags: "Cloud Rap, Alt-Pop",
    audioFile: "2026-06-03 lightris & sero excerpt.wav",
    youtubeId: "feyz3PxqceQ"
  },
  {
    title: "Sapsucker",
    date: "2026-06-13",
    tags: "Indie Rock, Indie Pop",
    audioFile: "2026-06-13 Sapsucker excerpt.wav",
    youtubeId: "R3ewWeoLWHw"
  },
  {
    title: "Steeplechase",
    date: "2026-06-26",
    tags: "Singer-Songwriter, Indie Pop",
    audioFile: "2026-06-26 Steeplechase excerpt.wav",
    youtubeId: "dcFNNLd9dW8"
  },
  {
    title: "diog3n3s",
    date: "2026-08-07",
    tags: "Singer-Songwriter, Indie Folk",
    audioFile: "2026-08-07 diog3n3s excerpt.wav",
    youtubeId: "UYB5IYjAgcY"
  }
];

const listPanel = document.getElementById('listPanel');
const videoFrame = document.getElementById('videoFrame');
const videoPlaceholder = document.getElementById('videoPlaceholder');
const vcTitle = document.getElementById('vcTitle');
const vcNote = document.getElementById('vcNote');
const audio = document.getElementById('audio');
const playPauseBtn = document.getElementById('playPause');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const seek = document.getElementById('seek');
const curTimeEl = document.getElementById('curTime');
const durTimeEl = document.getElementById('durTime');
const nowPlayingEl = document.getElementById('nowPlaying');
const nowTitleEl = document.getElementById('nowTitle');
const nowSubEl = document.getElementById('nowSub');
const emptyMsg = document.getElementById('emptyMsg');

let currentIndex = -1;
let rowEls = [];

function fmt(t){
  if(!isFinite(t)) return "0:00";
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

TRACKS.forEach((t, i) => {
  const row = document.createElement('button');
  row.type = 'button';
  row.className = 'track-row';
  row.innerHTML = `
    <span class="track-num">${(i+1).toString().padStart(2,'0')}</span>
    <span class="track-meta">
      <div class="track-title">${t.title}</div>
      <div class="track-sub">${t.date} · ${t.tags}</div>
    </span>
    <span class="track-state"></span>
  `;
  row.addEventListener('click', () => selectTrack(i));
  listPanel.appendChild(row);
  rowEls.push(row);
});

function updateVideoPanel(t){
  videoFrame.querySelectorAll('iframe').forEach(f => f.remove());
  vcTitle.textContent = t.title;

  if(t.youtubeId){
    videoPlaceholder.style.display = 'none';
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${t.youtubeId}?autoplay=1&mute=1`;
    iframe.title = t.title;
    iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
    iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    iframe.setAttribute('allowfullscreen', '');
    iframe.frameBorder = '0';
    videoFrame.appendChild(iframe);
    vcNote.textContent = 'Video muted — audio plays from the track below';
  } else {
    videoPlaceholder.style.display = 'flex';
    videoPlaceholder.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      No video for this recording yet
    `;
    vcNote.textContent = '';
  }
}

function renderStates(){
  rowEls.forEach((row, i) => {
    const stateEl = row.querySelector('.track-state');
    const isCurrent = i === currentIndex;
    row.classList.toggle('active', isCurrent);
    if(isCurrent && !audio.paused){
      stateEl.innerHTML = '<span class="bars"><span></span><span></span><span></span></span>';
    } else {
      stateEl.innerHTML = '';
    }
  });
}

function selectTrack(i){
  const t = TRACKS[i];
  updateVideoPanel(t);

  if(currentIndex === i){
    if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
    return;
  }

  currentIndex = i;

  if(t.audioFile){
    audio.src = encodeURI(t.audioFile);
    audio.play().catch(()=>{});
  } else {
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
  }

  nowPlayingEl.style.display = 'block';
  nowTitleEl.textContent = t.title;
  nowSubEl.textContent = t.audioFile ? `${t.date} · ${t.tags}` : 'No audio yet';
  playPauseBtn.disabled = !t.audioFile;
  seek.disabled = !t.audioFile;
  emptyMsg.style.display = 'none';
  renderStates();
}

playPauseBtn.addEventListener('click', () => {
  if(currentIndex === -1) return;
  if(audio.paused){ audio.play().catch(()=>{}); } else { audio.pause(); }
});

audio.addEventListener('play', () => {
  playIcon.style.display = 'none';
  pauseIcon.style.display = '';
  playPauseBtn.setAttribute('aria-label','Pause');
  renderStates();
});
audio.addEventListener('pause', () => {
  playIcon.style.display = '';
  pauseIcon.style.display = 'none';
  playPauseBtn.setAttribute('aria-label','Play');
  renderStates();
});
audio.addEventListener('ended', () => {
  if(currentIndex < TRACKS.length - 1){
    selectTrack(currentIndex + 1);
  } else {
    renderStates();
  }
});

let draggingSeek = false;
seek.addEventListener('mousedown', () => { draggingSeek = true; });
seek.addEventListener('touchstart', () => { draggingSeek = true; }, {passive:true});

function commitSeek(){
  draggingSeek = false;
  if(isFinite(audio.duration)){
    audio.currentTime = (seek.value / 100) * audio.duration;
  }
}
seek.addEventListener('mouseup', commitSeek);
seek.addEventListener('touchend', commitSeek);

seek.addEventListener('input', () => {
  if(isFinite(audio.duration)){
    curTimeEl.textContent = fmt((seek.value/100) * audio.duration);
  }
});

audio.addEventListener('timeupdate', () => {
  if(!isFinite(audio.duration)) return;
  if(!draggingSeek){
    seek.value = (audio.currentTime / audio.duration) * 100;
  }
  curTimeEl.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  durTimeEl.textContent = fmt(audio.duration);
});
</script>

</body>
</html>
